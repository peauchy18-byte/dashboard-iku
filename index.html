<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capaian IKU - Universitas Andalas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #fff; }

  /* HEADER */
  .header {
    background: #1a5e1a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .htitle { color: #fff; font-size: 13px; font-weight: 700; }
  .hsub   { color: rgba(255,255,255,.65); font-size: 10px; margin-top: 2px; }
  .htag   { background: rgba(255,255,255,.18); color: #fff; font-size: 10px; padding: 3px 10px; border-radius: 20px; }

  /* TABS */
  .tabs {
    display: flex;
    border-bottom: 2px solid #e8e8e8;
    background: #f9f9f9;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 60px;
    padding: 9px 4px 7px;
    text-align: center;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .15s;
    position: relative;
    bottom: -2px;
  }
  .tab:hover { background: #f0f0f0; }
  .tab.active { border-bottom: 3px solid #1a5e1a; background: #fff; }
  .tab .tn { font-size: 11px; font-weight: 700; color: #555; }
  .tab.active .tn { color: #1a5e1a; }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; margin: 3px auto 0; }

  /* CONTENT */
  .content { padding: 14px 16px 12px; }

  /* IKU TITLE ROW */
  .iku-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .iku-name { font-size: 13px; font-weight: 700; color: #1a5e1a; }
  .badge {
    font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
  }
  .badge-green { background: #e3f9e5; color: #166534; }
  .badge-amber { background: #fffbeb; color: #92400e; }
  .badge-red   { background: #fff1f2; color: #9f1239; }

  /* STAT PILLS - ringkas */
  .stats {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .stat {
    flex: 1;
    min-width: 70px;
    background: #f5f5f5;
    border-radius: 8px;
    padding: 7px 10px;
    text-align: center;
  }
  .stat-label { font-size: 9px; color: #999; margin-bottom: 2px; }
  .stat-val   { font-size: 16px; font-weight: 700; color: #222; line-height: 1; }
  .stat-unit  { font-size: 9px; color: #bbb; }
  .stat.hi    { background: #e3f9e5; }
  .stat.hi .stat-val { color: #166534; }
  .stat.lo    { background: #fff1f2; }
  .stat.lo .stat-val { color: #9f1239; }

  /* CHART */
  .chart-wrap { position: relative; width: 100%; height: 200px; }

  /* FOOTER */
  .footer {
    text-align: center; font-size: 10px; color: #ccc;
    padding: 8px; border-top: 1px solid #f0f0f0;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="htitle">Capaian IKU — Universitas Andalas</div>
    <div class="hsub">Direktorat Perencanaan dan Pengembangan</div>
  </div>
  <div class="htag">2021–2024</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="content">
  <div class="iku-title">
    <div class="iku-name" id="ikuName">-</div>
    <span class="badge" id="ikuBadge">-</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="footer">ditrenbang.unand.ac.id · Universitas Andalas</div>

<script>
const DATA = [
  { id:1, name:"Lulusan mendapat pekerjaan layak",       unit:"%",     c:[10.75,52.27,66.68,60.80], t:[80,60,80,80]     },
  { id:2, name:"Mahasiswa berprestasi",                  unit:"%",     c:[1.33, 18.92,4.22, 8.35],  t:[30,25,40,40]     },
  { id:3, name:"Dosen berkegiatan luar kampus",          unit:"%",     c:[7.72, 20.49,40.60,59.85], t:[20,30,30,32.1]   },
  { id:4, name:"Praktisi mengajar",                      unit:"%",     c:[38.35,49.91,5.09, 6.60],  t:[40,50,25,25]     },
  { id:5, name:"Hasil kerja dosen digunakan masyarakat", unit:"hasil", c:[2.76, 7.60, 7.26, 4.81],  t:[0.5,1,1,6]       },
  { id:6, name:"Prodi terakreditasi internasional",      unit:"prodi", c:[0.35, 0.92, 0.95, 2.00],  t:[0.5,0.5,0.7,2.6] },
  { id:7, name:"Kelas kolaborasi & berwawasan global",   unit:"%",     c:[18.70,29.21,22.00,15.33], t:[35,50,50,58.1]   },
  { id:8, name:"Prodi siap jadi PTN-BH",                 unit:"%",     c:[34.62,28.00,21.57,33.00], t:[8,5,10,33.33]    },
];
const YEARS = ['2021','2022','2023','2024'];
let active = 0, chart = null;

function pct(iku) { return Math.round((iku.c[3]/iku.t[3])*100); }
function dotColor(iku) { const p=pct(iku); return p>=90?'#4ade80':p>=60?'#fbbf24':'#f87171'; }

function buildTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  DATA.forEach((iku, i) => {
    const d = document.createElement('div');
    d.className = 'tab' + (i===active?' active':'');
    d.innerHTML = `<div class="tn">IKU ${iku.id}</div>
      <div class="dot" style="background:${dotColor(iku)}"></div>`;
    d.onclick = () => { active=i; buildTabs(); render(); };
    el.appendChild(d);
  });
}

function render() {
  const iku = DATA[active];
  const p = pct(iku);

  // Badge
  const badgeCls = p>=90?'badge-green':p>=60?'badge-amber':'badge-red';
  const badgeTxt = p>=90?'Tercapai ✓':p>=60?'Mendekati target':'Belum tercapai';
  document.getElementById('ikuName').textContent = `IKU ${iku.id} — ${iku.name}`;
  const badge = document.getElementById('ikuBadge');
  badge.className = 'badge ' + badgeCls;
  badge.textContent = `${p}% · ${badgeTxt}`;

  // Stats ringkas: capaian tiap tahun vs target
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = YEARS.map((y, i) => {
    const hit = iku.c[i] >= iku.t[i];
    return `<div class="stat ${hit?'hi':'lo'}">
      <div class="stat-label">${y}</div>
      <div class="stat-val">${iku.c[i]}</div>
      <div class="stat-unit">target: ${iku.t[i]}</div>
    </div>`;
  }).join('');

  // Chart
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: YEARS,
      datasets: [
        {
          label: 'Capaian',
          data: iku.c,
          borderColor: '#1a5e1a',
          backgroundColor: 'rgba(26,94,26,0.07)',
          borderWidth: 2.5,
          pointBackgroundColor: '#1a5e1a',
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.3
        },
        {
          label: 'Target',
          data: iku.t,
          borderColor: '#f97316',
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [5,4],
          pointBackgroundColor: '#f97316',
          pointRadius: 4,
          fill: false,
          tension: 0.3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          position: 'top',
          align: 'end',
          labels: { font: { size: 10 }, boxWidth: 20, padding: 8 }
        },
        tooltip: {
          callbacks: {
            label: c => ` ${c.dataset.label}: ${c.parsed.y} ${iku.unit}`
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(0,0,0,0.04)' },
          ticks: { font: { size: 11 }, color: '#888' }
        },
        y: {
          grid: { color: 'rgba(0,0,0,0.05)' },
          ticks: { font: { size: 10 }, color: '#aaa', maxTicksLimit: 5,
            callback: v => v + ' ' + iku.unit }
        }
      }
    }
  });
}

buildTabs();
render();
</script>
</body>
</html>
